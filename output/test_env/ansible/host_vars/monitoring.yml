---
dns_servers:
  - 172.26.0.20
grafana_alerting: {}
grafana_datasources:
  - access: proxy
    basicAuth: false
    name: prometheus
    type: prometheus
    url: http://localhost:9090
grafana_security:
  admin_password: root
  admin_user: admin
node_exporter_port: 9100
prometheus_scrape_configs:
  - job_name: node_exporter
    static_configs:
      - targets:
          - 172.26.0.10:9100
          - 172.26.0.20:9100
          - 172.26.0.30:9100
  - job_name: bind_exporter
    static_configs:
      - targets:
          - 172.26.0.20:9119
  - job_name: mysqld_exporter
    static_configs:
      - targets:
          - 172.26.0.10:9104
rhbase_firewall_allow_ports:
  - 53/tcp
  - 53/udp
  - 3000/tcp
rhbase_install_packages:
  - bash-completion
  - bind-utils
  - git
  - nano
  - setroubleshoot-server
  - tree
  - vim-enhanced
  - wget
