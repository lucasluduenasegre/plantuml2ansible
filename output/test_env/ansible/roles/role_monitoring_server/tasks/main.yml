# ansible/roles/role_monitoring_server/tasks/main.yml
---
- name: Include prometheus.prometheus.prometheus & grafana.grafana.grafana
  ansible.builtin.include_role:
    name: '{{ roles }}'
  loop:
    - prometheus.prometheus.prometheus
    - grafana.grafana.grafana
  loop_control:
    loop_var: roles

- name: Copy Grafana dashboard JSON files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/var/lib/grafana/dashboards/{{ item | basename }}"
    owner: grafana
    group: grafana
    mode: '0644'
  with_fileglob:
    - "files/grafana_dashboards/*.json"

- name: Restart grafana-server
  ansible.builtin.service:
    name: grafana-server
    state: restarted
